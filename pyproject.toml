[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "research-agent"
version = "0.1.0"
description = "Production-minded AI research agent"
readme = "AGENTS.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "openai>=1.0.0",
    "httpx>=0.27.0",
    "trafilatura>=1.8.0",
    "ddgs>=1.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
ui = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"research_agent.web" = ["static/*"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = [
    "live: tests requiring external network access",
]
addopts = "-m 'not live'"

